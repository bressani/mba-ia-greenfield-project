x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile.dev
  volumes:
    - .:/home/node/app

services:
  nestjs-api:
    <<: *backend
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  video-worker:
    <<: *backend
    profiles: [videos]
    command: ["node", "-r", "ts-node/register", "src/videos/video-worker.ts"]
    stop_grace_period: 35s
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  minio:
    image: ${MINIO_IMAGE:-streamtube-minio:RELEASE.2025-10-15T17-29-55Z}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.minio
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${MINIO_ROOT_USER:?Preencha S3_ACCESS_KEY_ID no .env}"
        : "$${MINIO_ROOT_PASSWORD:?Preencha S3_SECRET_ACCESS_KEY no .env}"
        exec minio server /data --address :9000
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - video-storage:/data

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  video-storage:


